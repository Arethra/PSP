<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Physical Security Portal</title>
        <style>
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:"Segoe UI",Arial,sans-serif;
            color:#20352c;
            background:#f5f7f6
            ;line-height:1.6}
            a{color:inherit}a:focus-visible,button:focus-visible{outline:3px solid #d2a64b;outline-offset:5px}.topbar{background:white;border-bottom:1px solid #e1e8e4;padding:18px max(24px,calc((100% - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:700;line-height:1.3}.mark{background:#0a6634;color:white;border-radius:12px;padding:12px;font-size:15px;letter-spacing:1px}.brand small{display:block;color:#6d7b72;font-size:12px;font-weight:400;margin-top:4px}nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}nav a{text-decoration:none;padding:10px 14px;border-radius:7px;font-size:14px}nav a:hover,nav a[aria-current=page]{background:#edf6f0;color:#0a6634}.exit{border:1px solid #dce6df}.wrap{max-width:1160px;margin:auto;padding:64px 24px}.eyebrow{color:#0a6634;letter-spacing:2px;font-size:12px;font-weight:700;text-transform:uppercase}h1{font-size:clamp(30px,4vw,44px);line-height:1.2;letter-spacing:-1px;margin:14px 0}h2{font-size:22px;line-height:1.3}.muted{color:#68796f}.button{display:inline-block;background:#0a6634;color:white;border:0;border-radius:8px;padding:14px 22px;text-decoration:none;font:600 15px "Segoe UI",Arial,sans-serif;cursor:pointer}.button:hover{background:#054b26}
        .login-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:80px;align-items:center;min-height:65vh}.intro p{max-width:470px;font-size:17px}.pill{display:inline-block;background:#e8f2ec;color:#0a6634;padding:6px 12px;border-radius:20px;font-size:12px;margin-top:26px}.panel{background:white;border:1px solid #dfe7e2;border-radius:18px;padding:36px;box-shadow:0 12px 35px #123d2210}.panel h2{margin-top:0}.field{margin:22px 0}label{display:block;font-weight:600;font-size:14px;margin-bottom:8px}input{width:100%;padding:14px;border:1px solid #cbd8cf;border-radius:7px;font:inherit;background:white}input:focus{outline:2px solid #0a6634;outline-offset:2px}.full{width:100%}.note{font-size:12px;color:#718077;margin:16px 0 0}.section-label{margin-top:44px;font-size:13px;letter-spacing:1px;color:#718077;text-transform:uppercase}.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:18px}.card{background:white;border:1px solid #dfe7e2;border-radius:16px;padding:32px;display:flex;flex-direction:column;align-items:flex-start}.icon{width:52px;height:52px;border-radius:12px;background:#eaf4ee;color:#0a6634;display:grid;place-items:center;font-size:23px}.card p{margin:0 0 28px;color:#68796f;max-width:420px}.card .button{margin-top:auto}.info{margin-top:32px;padding:18px 22px;background:#eaf3ed;border-radius:10px;font-size:14px;color:#42634f}footer{max-width:1160px;margin:0 auto;padding:24px;color:#7c8981;font-size:12px;border-top:1px solid #e1e8e4}@media(max-width:800px){.topbar{align-items:flex-start;flex-direction:column;gap:16px}.login-grid{grid-template-columns:1fr;gap:28px;min-height:auto}.wrap{padding-top:36px}.cards{grid-template-columns:1fr}.panel,.card{padding:26px}nav a{padding:8px 10px}.intro p{font-size:16px}}.cards{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.count{font-size:38px;font-weight:700;margin:14px 0}.card h2 a{text-decoration:none}.error{color:#a32626}.gbb-logo{width:128px;height:auto;display:block;object-fit:contain;flex-shrink:0}@media(max-width:480px){.gbb-logo{width:100px}}
        </style>
        </head>
        <body>
            <header class="topbar">
                <a class="brand" href="/dashboard">
                    <img class="gbb-logo" src="{{url_for('static', filename='gbb-logo.jpg')}}" alt="Galaxy Backbone" width="128" height="72">
                    <span>Physical Security Portal<small>Galaxy Backbone</small></span></a>{% if user %}<nav><a href="/dashboard">Dashboard</a><a href="/vms">VMS</a>{% if user.group in ["Admin","Physical Security"] %}<a href="/icms">ID Card Management</a>{% endif %}<form action="/logout" method="post"><input type="hidden" name="csrf" value="{{csrf}}"><button class="button">Sign out</button></form></nav>{% endif %}</header>{% block content %}{% endblock %}<footer>Galaxy Backbone · Physical Security</footer></body>
</html>
