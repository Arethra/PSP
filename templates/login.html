{% extends 'base.html' %}{% block content %}<main class="wrap login-grid"><section class="intro"><span class="eyebrow">Physical Security Portal</span><h1>Your security workspace.<br>One sign-in.</h1><p class="muted">Visitors, ID cards and reports, with access assigned to your user group.</p></section><section class="panel"><h2>Sign in</h2>{% if error %}<p class="error" role="alert">{{error}}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf" value="{{csrf}}"><div class="field"><label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="button full">Sign in</button></form></section></main>{% endblock %}
